<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Account Store BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen">

    <!-- Admin Login Protection Modal -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 max-w-sm w-full space-y-4">
            <h2 class="text-xl font-bold text-center">Admin Passcode</h2>
            <input type="password" id="adminPassInput" placeholder="Enter Security Password..." class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl p-3 text-sm focus:outline-none">
            <button onclick="checkAdminPassword()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl text-sm">Login</button>
        </div>
    </div>

    <div id="adminContent" class="hidden">
        <header class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 sticky top-0 z-50 p-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="font-bold text-lg text-red-500">Admin Control Panel</h1>
                <a href="index.html" class="text-xs text-blue-500 font-bold hover:underline">View User Site ↗</a>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

            <!-- 1. ADD MAIN CATEGORY -->
            <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 space-y-4">
                <h2 class="text-md font-bold">1. Create Main Category</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="catName" placeholder="Category Name (e.g. Gmail)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                    <input type="text" id="catDesc" placeholder="Category Description..." class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                </div>
                <button onclick="addCategory()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Add Category</button>
            </section>

            <!-- 2. ADD SUB-CATEGORY & STOCK -->
            <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 space-y-4">
                <h2 class="text-md font-bold">2. Add Sub-Category & Stock</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select id="subCatParent" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs"></select>
                    <input type="text" id="subCatName" placeholder="Sub-Category Name (e.g. Gmail PVA)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                    <input type="number" id="subCatPrice" step="0.01" placeholder="Price (BDT)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                </div>
                <textarea id="subCatDesc" placeholder="Sub-Category Description Box..." class="w-full bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs h-16"></textarea>
                <textarea id="subCatStock" placeholder="Paste Stock Accounts (One per line e.g. email:pass)" class="w-full bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs h-24 font-mono"></textarea>
                <button onclick="addSubCategory()" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Add Sub-Category & Stock</button>
            </section>

            <!-- 3. ADD PAYMENT METHOD -->
            <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 space-y-4">
                <h2 class="text-md font-bold">3. Set Payment Method (bKash/Nagad)</h2>
                <div class="grid grid-cols-3 gap-3">
                    <input type="text" id="payName" placeholder="Method (e.g. bKash)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                    <input type="text" id="payType" placeholder="Type (e.g. Personal)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                    <input type="text" id="payNum" placeholder="Number (e.g. 01700...)" class="bg-gray-50 dark:bg-slate-900 border p-3 rounded-xl text-xs">
                </div>
                <button onclick="addPaymentMethod()" class="bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Save Payment Method</button>
            </section>

            <!-- 4. DEPOSIT REQUESTS & APPROVAL -->
            <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-200 dark:border-slate-700 space-y-4">
                <h2 class="text-md font-bold">4. Pending Deposit Requests</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead>
                            <tr class="bg-gray-100 dark:bg-slate-900">
                                <th class="p-2">User Email</th>
                                <th class="p-2">Amount</th>
                                <th class="p-2">TrxID</th>
                                <th class="p-2">Action</th>
                            </tr>
                        </thead>
                        <tbody id="depositRequestsTable"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script>
        const ADMIN_PASSWORD = "HABIBI@RAJU143";

        function checkAdminPassword() {
            if(document.getElementById('adminPassInput').value === ADMIN_PASSWORD) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadAdminData();
            } else alert('Wrong Password!');
        }

        function addCategory() {
            const name = document.getElementById('catName').value;
            const desc = document.getElementById('catDesc').value;
            if(!name) return alert('Enter Category Name!');

            const categories = JSON.parse(localStorage.getItem('asb_categories')) || [];
            categories.push({ id: Date.now(), name, desc });
            localStorage.setItem('asb_categories', JSON.stringify(categories));
            alert('Category Added!');
            loadAdminData();
        }

        function addSubCategory() {
            const parent = document.getElementById('subCatParent').value;
            const name = document.getElementById('subCatName').value;
            const price = parseFloat(document.getElementById('subCatPrice').value) || 0;
            const desc = document.getElementById('subCatDesc').value;
            const stockRaw = document.getElementById('subCatStock').value;
            const stock = stockRaw.split('\n').filter(s => s.trim() !== '');

            if(!name || !price) return alert('Enter Name and Price!');

            const subCategories = JSON.parse(localStorage.getItem('asb_subcategories')) || [];
            subCategories.push({ id: 'sub_' + Date.now(), parent, name, price, desc, stock });
            localStorage.setItem('asb_subcategories', JSON.stringify(subCategories));
            alert('Sub-Category & Stock Added!');
        }

        function addPaymentMethod() {
            const name = document.getElementById('payName').value;
            const type = document.getElementById('payType').value;
            const number = document.getElementById('payNum').value;

            const payments = JSON.parse(localStorage.getItem('asb_payments')) || [];
            payments.push({ name, type, number });
            localStorage.setItem('asb_payments', JSON.stringify(payments));
            alert('Payment Method Added!');
        }

        function loadAdminData() {
            const categories = JSON.parse(localStorage.getItem('asb_categories')) || [];
            const select = document.getElementById('subCatParent');
            select.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

            const requests = JSON.parse(localStorage.getItem('asb_deposit_requests')) || [];
            const tbody = document.getElementById('depositRequestsTable');
            tbody.innerHTML = requests.map(r => `
                <tr class="border-b dark:border-slate-700">
                    <td class="p-2">${r.email}</td>
                    <td class="p-2 text-emerald-500 font-bold">৳${r.amount}</td>
                    <td class="p-2 font-mono">${r.trx}</td>
                    <td class="p-2 space-x-1">
                        <button onclick="approveDeposit(${r.id}, ${r.amount})" class="bg-emerald-600 text-white px-2 py-1 rounded">Approve</button>
                    </td>
                </tr>
            `).join('');
        }

        function approveDeposit(id, amount) {
            let requests = JSON.parse(localStorage.getItem('asb_deposit_requests')) || [];
            requests = requests.filter(r => r.id !== id);
            localStorage.setItem('asb_deposit_requests', JSON.stringify(requests));

            let currentBal = parseFloat(localStorage.getItem('asb_user_balance')) || 0;
            localStorage.setItem('asb_user_balance', currentBal + parseFloat(amount));

            alert(`Approved ৳${amount} to User Balance!`);
            loadAdminData();
        }
    </script>
</body>
</html>
