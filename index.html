<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mail Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b132b; color: #ffffff; }
        .card-bg { background-color: #1c2541; border: 1px solid #2a3859; }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-[#0b132b] sticky top-0 z-50">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="showTab('home')">
            <i class="fa-solid fa-store text-blue-500 text-xl"></i>
            <h1 class="text-xl font-extrabold text-blue-500">Mail Market</h1>
        </div>
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 px-3 py-1 rounded-full font-bold text-xs flex items-center space-x-1">
                <span>৳</span><span id="userBalance">50.00</span>
            </div>
            <div id="navAuthBtn">
                <button onclick="showTab('login')" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-bold text-xs px-3 py-1.5 rounded-xl">Login</button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="p-4 max-w-lg mx-auto">
        
        <!-- HOME / SHOP -->
        <div id="page-home" class="space-y-5">
            <div class="flex space-x-2 overflow-x-auto pb-1" id="categoryContainer"></div>
            <div class="space-y-3" id="productsContainer"></div>

            <div class="card-bg p-4 rounded-2xl space-y-3">
                <div class="flex items-center space-x-2 text-emerald-400 font-bold text-sm">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Live Deposits (Last 1 Hour)</span>
                </div>
                <div class="space-y-2 text-xs text-slate-400">
                    <p>sn*******40@gmail.com - Added via bKash Personal (৳25)</p>
                </div>
            </div>

            <div class="card-bg p-4 rounded-2xl space-y-3">
                <div class="flex items-center space-x-2 text-cyan-400 font-bold text-sm">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Live Purchases (Last 1 Hour)</span>
                </div>
                <div class="space-y-2 text-xs text-slate-400">
                    <p>No recent purchases in the last hour.</p>
                </div>
            </div>
        </div>

        <!-- LOGIN / REGISTER -->
        <div id="page-login" class="hidden space-y-4">
            <div class="card-bg p-5 rounded-2xl space-y-4 border border-slate-700">
                <div class="flex border-b border-slate-700 pb-2 text-sm font-bold">
                    <button onclick="toggleAuth('login')" id="btnTabLogin" class="w-1/2 text-center text-blue-500 border-b-2 border-blue-500 pb-2">Login</button>
                    <button onclick="toggleAuth('register')" id="btnTabRegister" class="w-1/2 text-center text-slate-400 pb-2">Register</button>
                </div>

                <form id="formLogin" onsubmit="handleDemoLogin(event)" class="space-y-3">
                    <div>
                        <label class="text-[10px] text-slate-400">Email Address</label>
                        <input type="email" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1" value="user@gmail.com">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Password</label>
                        <input type="password" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1" value="123456">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl">Login to Account</button>
                </form>

                <form id="formRegister" onsubmit="handleDemoLogin(event)" class="space-y-3 hidden">
                    <div>
                        <label class="text-[10px] text-slate-400">Full Name</label>
                        <input type="text" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Email Address</label>
                        <input type="email" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Password</label>
                        <input type="password" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl">Create Account</button>
                </form>
            </div>
        </div>

        <!-- DEPOSIT -->
        <div id="page-deposit" class="hidden space-y-4">
            <div class="card-bg p-5 rounded-2xl space-y-4">
                <h2 class="font-bold text-sm text-center text-slate-200">Add Balance (bKash / Nagad)</h2>
                <input type="number" placeholder="Amount (Min ৳10)" class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                <input type="text" placeholder="TrxID" class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                <button onclick="alert('Deposit request sent!'); showTab('home');" class="w-full bg-emerald-600 font-bold text-xs py-3 rounded-xl text-white">Submit Payment</button>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b132b] border-t border-slate-800 px-6 py-2 flex justify-between items-center text-xs text-slate-400 z-50">
        <button onclick="showTab('home')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </button>
        <button onclick="showTab('deposit')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span>Deposit</span>
        </button>
        <button onclick="alert('History Loaded')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-rotate-left text-lg"></i>
            <span>History</span>
        </button>
        <button onclick="alert('Logged out'); location.reload();" class="flex flex-col items-center space-y-1 hover:text-red-400">
            <i class="fa-solid fa-power-off text-lg"></i>
            <span>Logout</span>
        </button>
    </nav>

    <script>
        const categories = ["Hotmail", "Gmail", "Vpn"];
        const products = [
            { id: 1, title: "Express vpn 7 Day", category: "Vpn", price: 30.00, stock: 2 },
            { id: 2, title: "Hotmail Premium 2024", category: "Hotmail", price: 5.00, stock: 0 },
            { id: 3, title: "HOTMAIL Trust", category: "Hotmail", price: 0.70, stock: 0 }
        ];

        let selectedCat = "Vpn";

        function renderCategories() {
            document.getElementById('categoryContainer').innerHTML = categories.map(c => `
                <button onclick="selectCategory('${c}')" 
                    class="px-5 py-2 rounded-full font-bold text-xs border border-slate-700 transition ${selectedCat === c ? 'bg-blue-600 text-white' : 'bg-[#1c2541] text-slate-300'}">
                    ${c}
                </button>
            `).join('');
        }

        function selectCategory(c) {
            selectedCat = c;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const filtered = products.filter(p => p.category === selectedCat);
            const container = document.getElementById('productsContainer');

            if(filtered.length === 0) {
                container.innerHTML = `<div class="card-bg p-4 rounded-xl text-center text-xs text-slate-400">No products available.</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="card-bg p-4 rounded-2xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-slate-100">${p.title}</h3>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${p.stock > 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                            ${p.stock > 0 ? 'IN STOCK' : 'OUT OF STOCK'}
                        </span>
                    </div>
                    <div class="text-blue-400 font-black text-base">৳ ${p.price.toFixed(2)}</div>
                    <div class="text-xs text-slate-400 flex items-center space-x-1">
                        <i class="fa-solid fa-box text-slate-500"></i>
                        <span>Available: <strong class="text-slate-200">${p.stock}</strong></span>
                    </div>
                    <button ${p.stock <= 0 ? 'disabled' : ''} onclick="alert('Purchased Successfully!')"
                        class="w-full py-2.5 rounded-xl font-bold text-xs transition ${p.stock > 0 ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}">
                        ${p.stock > 0 ? 'Buy Now' : 'Out of Stock'}
                    </button>
                </div>
            `).join('');
        }

        function showTab(tab) {
            ['home', 'login', 'deposit'].forEach(t => document.getElementById(`page-${t}`).classList.add('hidden'));
            document.getElementById(`page-${tab}`).classList.remove('hidden');
        }

        function handleDemoLogin(e) {
            e.preventDefault();
            document.getElementById('navAuthBtn').innerHTML = `<span class="text-xs text-emerald-400 font-bold">User</span>`;
            alert("Login Successful!");
            showTab('home');
        }

        function toggleAuth(type) {
            if(type === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formRegister').classList.add('hidden');
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formRegister').classList.remove('hidden');
            }
        }

        window.onload = () => { renderCategories(); renderProducts(); };
    </script>
</body>
</html>
