<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Store BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 md:pb-8">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2" onclick="showTab('shop')">
                <div class="bg-blue-600 text-white font-black px-2.5 py-1 rounded-xl text-base">ASB</div>
                <span class="font-bold text-sm md:text-base">Account Store <span class="text-emerald-400">BD</span></span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="bg-slate-700/60 px-2.5 py-1 rounded-xl border border-slate-600 flex items-center space-x-1">
                    <span class="text-[10px] text-slate-300">Balance:</span>
                    <span id="userBalanceDisplay" class="font-bold text-emerald-400 text-xs">৳০.০০</span>
                </div>
                <div id="authHeaderBtn">
                    <button onclick="showTab('auth')" class="bg-blue-600 text-white font-bold text-xs px-2.5 py-1.5 rounded-xl">Login</button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-3 flex space-x-2 border-b border-slate-700 pb-2 overflow-x-auto">
        <button onclick="showTab('shop')" id="tab-shop" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-600 text-white flex-shrink-0">🛍️ Shop</button>
        <button onclick="showTab('deposit')" id="tab-deposit" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 flex-shrink-0">💳 Deposit</button>
        <button onclick="showTab('profile')" id="tab-profile" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 flex-shrink-0">👤 Orders</button>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-4 space-y-5">
        <!-- AUTH TAB -->
        <div id="page-auth" class="hidden max-w-sm mx-auto bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <div class="flex border-b border-slate-700 pb-2">
                <button onclick="toggleAuthForm('login')" id="btnAuthLogin" class="w-1/2 font-bold text-xs text-blue-500 border-b-2 border-blue-500 pb-2">Login</button>
                <button onclick="toggleAuthForm('signup')" id="btnAuthSignup" class="w-1/2 font-bold text-xs text-slate-400 pb-2">Register</button>
            </div>
            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-3">
                <input type="email" id="loginEmail" placeholder="Email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <input type="password" id="loginPass" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Login</button>
            </form>
            <form id="formSignup" onsubmit="handleSignup(event)" class="space-y-3 hidden">
                <input type="text" id="regName" placeholder="Full Name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <input type="email" id="regEmail" placeholder="Email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <input type="password" id="regPass" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs">Register</button>
            </form>
        </div>

        <!-- SHOP TAB -->
        <div id="page-shop" class="space-y-5">
            <div>
                <h2 class="text-xs font-bold mb-2">Categories</h2>
                <div class="flex space-x-2 overflow-x-auto" id="dynamicCategoryBar">
                    <p class="text-xs text-slate-400">Loading categories...</p>
                </div>
            </div>

            <div class="space-y-3">
                <h2 class="text-xs font-bold">Products Stock</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" id="dynamicProductsContainer">
                    <p class="text-xs text-slate-400">Loading products...</p>
                </div>
            </div>
        </div>

        <!-- DEPOSIT TAB -->
        <div id="page-deposit" class="hidden max-w-md mx-auto bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-base font-bold text-center">Add Deposit (Min ৳25)</h2>
            <div class="grid grid-cols-3 gap-2" id="paymentMethodsButtons">
                <button type="button" onclick="selectPaymentMethod('bKash', '01700000000')" class="p-2 border border-slate-700 bg-slate-900 rounded-xl text-xs font-bold text-blue-400">bKash</button>
                <button type="button" onclick="selectPaymentMethod('Nagad', '01800000000')" class="p-2 border border-slate-700 bg-slate-900 rounded-xl text-xs font-bold text-orange-400">Nagad</button>
                <button type="button" onclick="selectPaymentMethod('Rocket', '01900000000')" class="p-2 border border-slate-700 bg-slate-900 rounded-xl text-xs font-bold text-purple-400">Rocket</button>
            </div>
            <div id="depositInstruction" class="text-xs text-amber-300 bg-slate-900 p-3 rounded-xl border border-slate-700">Select payment method above.</div>
            <form onsubmit="handleDepositSubmit(event)" class="space-y-3">
                <input type="number" id="depAmount" min="25" placeholder="Amount (Min 25 BDT)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs">
                <input type="text" id="depTrx" placeholder="TrxID" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs uppercase font-mono">
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs">Submit Request</button>
            </form>
        </div>

        <!-- PROFILE / ORDERS TAB -->
        <div id="page-profile" class="hidden space-y-4 max-w-3xl mx-auto">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                <div>
                    <h2 class="text-sm font-bold" id="profileUserName">User</h2>
                    <p class="text-[11px] text-slate-400" id="profileUserEmail">email@example.com</p>
                </div>
                <button onclick="handleLogout()" class="bg-red-500/20 text-red-400 font-bold text-xs px-3 py-1.5 rounded-xl">Logout</button>
            </div>
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h2 class="text-xs font-bold">Purchased Orders</h2>
                <div id="purchasedListContainer" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <script>
        // 1. Firebase Config (Replace with YOUR Firebase credentials)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('asb_active_user')) || null;
        let selectedMethodName = '';

        // Realtime Data Sync from Firebase
        function listenToData() {
            db.ref('categories').on('value', snapshot => {
                const data = snapshot.val() || {};
                const catContainer = document.getElementById('dynamicCategoryBar');
                const list = Object.values(data);
                if(list.length === 0) catContainer.innerHTML = `<p class="text-xs text-slate-400">No categories found.</p>`;
                else {
                    catContainer.innerHTML = list.map(c => `
                        <button class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">${c.name}</button>
                    `).join('');
                }
            });

            db.ref('subcategories').on('value', snapshot => {
                const data = snapshot.val() || {};
                const prodContainer = document.getElementById('dynamicProductsContainer');
                const list = Object.entries(data);
                if(list.length === 0) prodContainer.innerHTML = `<p class="text-xs text-slate-400">No products available.</p>`;
                else {
                    prodContainer.innerHTML = list.map(([key, s]) => {
                        const stockList = s.stock || [];
                        return `
                            <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700 space-y-3">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-xs">${s.name}</h3>
                                    <span class="text-xs font-bold text-emerald-400">৳${s.price}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 bg-slate-900 p-2 rounded-xl border border-slate-800">${s.desc || 'No details'}</p>
                                <div class="flex justify-between items-center text-xs pt-1">
                                    <span class="text-slate-400">Stock: <strong class="text-emerald-400">${stockList.length} pcs</strong></span>
                                    <button onclick="buyProduct('${key}')" class="bg-blue-600 text-white px-3 py-1 rounded-xl text-xs font-bold">Buy</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            });

            if(currentUser) {
                db.ref('users/' + currentUser.key).on('value', snapshot => {
                    const userData = snapshot.val();
                    if(userData) {
                        currentUser = { ...userData, key: currentUser.key };
                        document.getElementById('userBalanceDisplay').innerText = `৳${(userData.balance || 0).toFixed(2)}`;
                        document.getElementById('profileUserName').innerText = userData.name;
                        document.getElementById('profileUserEmail').innerText = userData.email;
                        document.getElementById('authHeaderBtn').innerHTML = `<span class="text-xs text-emerald-400 font-bold">${userData.name}</span>`;
                        renderOrders(userData.purchases || []);
                    }
                });
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value.toLowerCase().trim();
            const pass = document.getElementById('regPass').value;

            const userRef = db.ref('users').push();
            const newUser = { name, email, pass, balance: 0, purchases: [] };
            userRef.set(newUser).then(() => {
                currentUser = { ...newUser, key: userRef.key };
                localStorage.setItem('asb_active_user', JSON.stringify(currentUser));
                alert('Account Registered!');
                showTab('shop');
                location.reload();
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.toLowerCase().trim();
            const pass = document.getElementById('loginPass').value;

            db.ref('users').once('value', snapshot => {
                const users = snapshot.val() || {};
                const foundKey = Object.keys(users).find(k => users[k].email === email && users[k].pass === pass);
                if(foundKey) {
                    currentUser = { ...users[foundKey], key: foundKey };
                    localStorage.setItem('asb_active_user', JSON.stringify(currentUser));
                    alert('Logged In!');
                    showTab('shop');
                    location.reload();
                } else alert('Invalid Email or Password!');
            });
        }

        function buyProduct(subKey) {
            if(!currentUser) return alert('Please login first!');
            db.ref('subcategories/' + subKey).once('value', snapshot => {
                const sub = snapshot.val();
                if(!sub || !sub.stock || sub.stock.length === 0) return alert('Out of stock!');
                if(currentUser.balance < sub.price) return alert('Insufficient Balance!');

                const boughtItem = sub.stock.shift();
                const newBalance = currentUser.balance - sub.price;

                const purchases = currentUser.purchases || [];
                purchases.push({ date: new Date().toLocaleDateString(), item: sub.name, data: boughtItem });

                // Update Database
                db.ref('subcategories/' + subKey + '/stock').set(sub.stock);
                db.ref('users/' + currentUser.key).update({ balance: newBalance, purchases: purchases });

                alert('Purchase Successful! Check your orders tab.');
            });
        }

        function selectPaymentMethod(name, num) {
            selectedMethodName = name;
            document.getElementById('depositInstruction').innerHTML = `Send Money to <strong>${name}</strong>: <span class="text-white font-mono font-bold">${num}</span>`;
        }

        function handleDepositSubmit(e) {
            e.preventDefault();
            if(!currentUser) return alert('Please Login first!');
            const amount = parseFloat(document.getElementById('depAmount').value);
            const trx = document.getElementById('depTrx').value.trim();

            db.ref('deposits').push({
                userKey: currentUser.key,
                email: currentUser.email,
                amount: amount,
                trx: trx,
                method: selectedMethodName || 'bKash',
                status: 'Pending'
            });

            alert('Deposit Request Submitted!');
            e.target.reset();
        }

        function renderOrders(purchases) {
            const container = document.getElementById('purchasedListContainer');
            if(purchases.length === 0) container.innerHTML = `<p class="text-xs text-slate-400">No orders found.</p>`;
            else {
                container.innerHTML = purchases.map(p => `
                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-xs space-y-1">
                        <div class="flex justify-between font-bold text-blue-400"><span>${p.item}</span><span class="text-slate-500 text-[10px]">${p.date}</span></div>
                        <div class="font-mono text-emerald-400 bg-slate-800 p-2 rounded select-all break-all text-[11px]">${p.data}</div>
                    </div>
                `).join('');
            }
        }

        function handleLogout() {
            localStorage.removeItem('asb_active_user');
            currentUser = null;
            location.reload();
        }

        function showTab(tab) {
            ['shop', 'deposit', 'profile', 'auth'].forEach(t => document.getElementById(`page-${t}`).classList.add('hidden'));
            document.getElementById(`page-${tab}`).classList.remove('hidden');
        }

        function toggleAuthForm(type) {
            if(type === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formSignup').classList.add('hidden');
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formSignup').classList.remove('hidden');
            }
        }

        window.onload = listenToData;
    </script>
</body>
</html>
