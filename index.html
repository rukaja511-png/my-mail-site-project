<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market - User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #0b132b;
            --card-bg: #1c2541;
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --border-color: #3a506b;
            --input-bg: #10172a;
            --accent-blue: #3b82f6;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            padding-bottom: 80px;
        }

        .top-navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control::placeholder { color: #94a3b8 !important; }

        .bottom-nav {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 10px 0;
        }

        .bottom-nav a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }

        .bottom-nav a.active, .bottom-nav a:hover {
            color: var(--accent-blue);
        }

        .bottom-nav i {
            font-size: 18px;
            display: block;
            margin-bottom: 3px;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body>

<!-- Top Navbar -->
<div class="top-navbar d-flex justify-content-between align-items-center">
    <h4 class="m-0 fw-bold text-primary"><i class="fa-solid fa-store me-2"></i>Mail Market</h4>
    <div id="user-wallet-badge" class="badge bg-primary fs-6 py-2 px-3" style="display:none;">
        ৳ <span id="nav-balance">0.00</span>
    </div>
</div>

<div class="container mt-4" style="max-width: 650px;">

    <!-- AUTH SECTION (Login / Register with Email & Password) -->
    <div id="auth-section" class="page-section active">
        <div class="card-box p-4 text-center">
            <div class="mb-3">
                <i class="fa-solid fa-lock text-primary fs-1"></i>
            </div>
            <h5 class="fw-bold text-white mb-2">Welcome to Mail Market</h5>
            <p class="text-sub small mb-4">Please login or register with email and password to access</p>
            
            <div class="mb-3 text-start">
                <label class="small text-sub mb-1">Email Address</label>
                <input type="email" id="auth-email" class="form-control" placeholder="user@gmail.com">
            </div>

            <div class="mb-4 text-start">
                <label class="small text-sub mb-1">Password</label>
                <input type="password" id="auth-pass" class="form-control" placeholder="Enter password">
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <button onclick="handleAuth('login')" class="btn btn-primary w-100 fw-bold py-2">Login</button>
                </div>
                <div class="col-6">
                    <button onclick="handleAuth('register')" class="btn btn-outline-light w-100 fw-bold py-2">Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HOME / STORE SECTION -->
    <div id="home-section" class="page-section">
        <div class="mb-3">
            <label class="small text-sub mb-1">Select Category</label>
            <select id="store-cat-select" class="form-select" onchange="renderStoreItems()"></select>
        </div>
        <div id="store-items-container"></div>
    </div>

    <!-- DEPOSIT SECTION -->
    <div id="deposit-section" class="page-section">
        <div class="card-box p-4 mb-4">
            <h6 class="fw-bold mb-3 text-success"><i class="fa-solid fa-wallet me-2"></i>Add Balance (Deposit)</h6>
            
            <div class="mb-3">
                <label class="small text-sub mb-1">Select Payment Method</label>
                <select id="deposit-method-select" class="form-select" onchange="updatePaymentNumberInfo()">
                    <option value="">-- Choose Method --</option>
                </select>
            </div>

            <div class="alert alert-dark border border-secondary small text-sub mb-3" id="payment-instruction-box">
                Select a payment method to view send money number.
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Send Money TrxID / Reference</label>
                <input type="text" id="deposit-trx" class="form-control" placeholder="e.g. 9H7K3L2M1">
            </div>

            <div class="mb-3">
                <label class="small text-sub mb-1">Amount Sent (৳)</label>
                <input type="number" id="deposit-amount" class="form-control" placeholder="100">
            </div>

            <button onclick="submitDepositRequest()" class="btn btn-success w-100 fw-bold py-2">Submit Deposit Request</button>
        </div>
    </div>

    <!-- HISTORY SECTION -->
    <div id="history-section" class="page-section">
        <div class="card-box p-4">
            <h6 class="fw-bold mb-3 text-info"><i class="fa-solid fa-clock-rotate-left me-2"></i>Transaction & Purchase History</h6>
            <div id="user-history-list" class="small"></div>
        </div>
    </div>

</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav container" style="max-width: 650px; display:none;" id="bottom-nav-bar">
    <div class="row text-center m-0">
        <div class="col-3"><a href="#" onclick="switchTab('home')" class="active" id="nav-btn-home"><i class="fa-solid fa-house"></i>Home</a></div>
        <div class="col-3"><a href="#" onclick="switchTab('deposit')" id="nav-btn-deposit"><i class="fa-solid fa-wallet"></i>Deposit</a></div>
        <div class="col-3"><a href="#" onclick="switchTab('history')" id="nav-btn-history"><i class="fa-solid fa-history"></i>History</a></div>
        <div class="col-3"><a href="#" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('app_current_user')) || null;

    function checkLoginState() {
        if(currentUser) {
            document.getElementById('auth-section').classList.remove('active');
            document.getElementById('home-section').classList.add('active');
            document.getElementById('bottom-nav-bar').style.display = 'block';
            document.getElementById('user-wallet-badge').style.display = 'block';
            updateUserBalanceDisplay();
            loadStoreCategories();
        } else {
            document.getElementById('auth-section').classList.add('active');
            document.getElementById('home-section').classList.remove('active');
            document.getElementById('deposit-section').classList.remove('active');
            document.getElementById('history-section').classList.remove('active');
            document.getElementById('bottom-nav-bar').style.display = 'none';
            document.getElementById('user-wallet-badge').style.display = 'none';
        }
    }

    function handleAuth(type) {
        let email = document.getElementById('auth-email').value.trim().toLowerCase();
        let pass = document.getElementById('auth-pass').value.trim();

        if(!email || !pass) return alert('Please enter both email and password!');

        let users = JSON.parse(localStorage.getItem('app_users')) || [];

        if(type === 'register') {
            let exists = users.find(u => u.email === email);
            if(exists) return alert('User already exists with this email! Please login.');
            
            let newUser = { email: email, pass: pass, balance: 0, history: [] };
            users.push(newUser);
            localStorage.setItem('app_users', JSON.stringify(users));
            currentUser = newUser;
            localStorage.setItem('app_current_user', JSON.stringify(currentUser));
            alert('Registration Successful!');
            checkLoginState();
        } else if(type === 'login') {
            let user = users.find(u => u.email === email && u.pass === pass);
            if(!user) return alert('Invalid email or password!');
            
            currentUser = user;
            localStorage.setItem('app_current_user', JSON.stringify(currentUser));
            alert('Login Successful!');
            checkLoginState();
        }
    }

    function logoutUser() {
        localStorage.removeItem('app_current_user');
        currentUser = null;
        checkLoginState();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.bottom-nav a').forEach(el => el.classList.remove('active'));

        if(tabName === 'home') {
            document.getElementById('home-section').classList.add('active');
            document.getElementById('nav-btn-home').classList.add('active');
            loadStoreCategories();
        } else if(tabName === 'deposit') {
            document.getElementById('deposit-section').classList.add('active');
            document.getElementById('nav-btn-deposit').classList.add('active');
            loadPaymentMethods();
        } else if(tabName === 'history') {
            document.getElementById('history-section').classList.add('active');
            document.getElementById('nav-btn-history').classList.add('active');
            loadUserHistory();
        }
    }

    function updateUserBalanceDisplay() {
        if(!currentUser) return;
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let u = users.find(x => x.email === currentUser.email);
        if(u) {
            currentUser = u;
            localStorage.setItem('app_current_user', JSON.stringify(currentUser));
            document.getElementById('nav-balance').innerText = Number(u.balance || 0).toFixed(2);
        }
    }

    function loadStoreCategories() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let select = document.getElementById('store-cat-select');
        select.innerHTML = '<option value="">-- All Categories --</option>';

        Object.keys(store).forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
        renderStoreItems();
    }

    function renderStoreItems() {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let selectedCat = document.getElementById('store-cat-select').value;
        let container = document.getElementById('store-items-container');
        container.innerHTML = '';

        let hasItems = false;
        Object.keys(store).forEach(cat => {
            if(selectedCat && selectedCat !== cat) return;

            store[cat].forEach((item, itemIdx) => {
                hasItems = true;
                let count = item.mails ? item.mails.length : 0;
                container.innerHTML += `
                    <div class="card-box p-3 mb-3 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-secondary mb-1">${cat}</span>
                            <div class="fw-bold text-white">${item.title}</div>
                            <div class="text-warning small">Price: ৳${Number(item.price).toFixed(2)}</div>
                            <div class="text-sub small">In Stock: <span class="${count > 0 ? 'text-success fw-bold' : 'text-danger'}">${count} pcs</span></div>
                        </div>
                        <div>
                            <button onclick="buyItem('${cat}', ${itemIdx})" class="btn btn-sm btn-primary fw-bold px-3 py-2" ${count === 0 ? 'disabled' : ''}>Buy Now</button>
                        </div>
                    </div>`;
            });
        });

        if(!hasItems) {
            container.innerHTML = '<div class="text-sub text-center py-4">No products available in this category.</div>';
        }
    }

    function buyItem(cat, index) {
        let store = JSON.parse(localStorage.getItem('app_store_data')) || {};
        let item = store[cat][index];
        let price = Number(item.price);

        if(!item.mails || item.mails.length === 0) return alert('Out of stock!');

        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let uIdx = users.findIndex(u => u.email === currentUser.email);

        if(users[uIdx].balance < price) {
            return alert('Insufficient balance! Please deposit first.');
        }

        // Deduct balance & give mail
        users[uIdx].balance -= price;
        let purchasedMail = item.mails.shift(); // take one mail

        if(!users[uIdx].history) users[uIdx].history = [];
        users[uIdx].history.unshift({
            type: 'purchase',
            title: item.title,
            price: price,
            detail: purchasedMail,
            time: new Date().toLocaleString()
        });

        localStorage.setItem('app_users', JSON.stringify(users));
        localStorage.setItem('app_store_data', JSON.stringify(store));
        
        updateUserBalanceDisplay();
        renderStoreItems();
        alert(`Purchase Successful!\n\nMail Info: ${purchasedMail}`);
    }

    function loadPaymentMethods() {
        let nums = JSON.parse(localStorage.getItem('app_pay_numbers')) || {};
        let select = document.getElementById('deposit-method-select');
        select.innerHTML = '<option value="">-- Choose Method --</option>';

        Object.keys(nums).forEach(m => {
            select.innerHTML += `<option value="${m}">${m.toUpperCase()} - ${nums[m]}</option>`;
        });
    }

    function updatePaymentNumberInfo() {
        let method = document.getElementById('deposit-method-select').value;
        let nums = JSON.parse(localStorage.getItem('app_pay_numbers')) || {};
        let box = document.getElementById('payment-instruction-box');

        if(method && nums[method]) {
            box.innerHTML = `Send Money to this <strong>${method.toUpperCase()}</strong> Number: <span class="text-warning fw-bold fs-6">${nums[method]}</span> (Personal). After sending, enter your TrxID and amount below.`;
        } else {
            box.innerHTML = 'Select a payment method to view send money number.';
        }
    }

    function submitDepositRequest() {
        let method = document.getElementById('deposit-method-select').value;
        let trx = document.getElementById('deposit-trx').value.trim();
        let amount = Number(document.getElementById('deposit-amount').value);

        if(!method || !trx || !amount || amount <= 0) {
            return alert('Please fill all fields correctly!');
        }

        let deps = JSON.parse(localStorage.getItem('app_pending_deposits')) || [];
        deps.push({
            user: currentUser.email,
            method: method.toUpperCase(),
            trx: trx,
            amount: amount,
            time: new Date().toLocaleTimeString()
        });

        localStorage.setItem('app_pending_deposits', JSON.stringify(deps));
        alert('Deposit request submitted successfully! Waiting for admin approval.');
        
        document.getElementById('deposit-trx').value = '';
        document.getElementById('deposit-amount').value = '';
        switchTab('history');
    }

    function loadUserHistory() {
        let users = JSON.parse(localStorage.getItem('app_users')) || [];
        let u = users.find(x => x.email === currentUser.email);
        let container = document.getElementById('user-history-list');
        container.innerHTML = '';

        if(!u || !u.history || u.history.length === 0) {
            container.innerHTML = '<div class="text-sub text-center py-2">No transaction history found.</div>';
            return;
        }

        u.history.forEach(h => {
            if(h.type === 'purchase') {
                container.innerHTML += `
                    <div class="bg-dark p-3 rounded mb-2 border-start border-4 border-success">
                        <div class="fw-bold text-white">Bought: ${h.title}</div>
                        <div class="text-warning">Price: ৳${h.price}</div>
                        <div class="text-info small text-break mt-1">Data: <code>${h.detail}</code></div>
                        <div class="text-sub small mt-1">${h.time}</div>
                    </div>`;
            } else {
                container.innerHTML += `
                    <div class="bg-dark p-3 rounded mb-2 border-start border-4 border-primary">
                        <div class="fw-bold text-white">Balance Added (${h.method})</div>
                        <div class="text-success fw-bold">+৳${h.amount}</div>
                        ${h.trx ? `<div class="text-sub small">TrxID: ${h.trx}</div>` : ''}
                        <div class="text-sub small mt-1">${h.time}</div>
                    </div>`;
            }
        });
    }

    checkLoginState();
</script>
</body>
</html>
