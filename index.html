<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mail Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b132b; color: #ffffff; }
        .card-bg { background-color: #1c2541; border: 1px solid #2a3859; }
    </style>
</head>
<body class="pb-20">

    <!-- Auth Protected Header -->
    <header id="mainHeader" class="hidden p-4 justify-between items-center border-b border-slate-800 bg-[#0b132b] sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-store text-blue-500 text-xl"></i>
            <h1 class="text-xl font-extrabold text-blue-500">Mail Market</h1>
        </div>
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 px-3 py-1 rounded-full font-bold text-xs flex items-center space-x-1">
                <span>৳</span><span id="userBalance">0.00</span>
            </div>
            <span id="userName" class="text-xs text-slate-300 font-bold"></span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="p-4 max-w-lg mx-auto">
        
        <!-- ================= 1. LOGIN / REGISTER PAGE ================= -->
        <div id="page-auth" class="space-y-4 my-10">
            <div class="text-center space-y-2">
                <i class="fa-solid fa-store text-blue-500 text-4xl"></i>
                <h2 class="text-2xl font-bold text-blue-500">Mail Market</h2>
                <p class="text-xs text-slate-400">Please login to access store features</p>
            </div>

            <div class="card-bg p-5 rounded-2xl space-y-4 border border-slate-700">
                <div class="flex border-b border-slate-700 pb-2 text-sm font-bold">
                    <button type="button" onclick="toggleAuth('login')" id="btnTabLogin" class="w-1/2 text-center text-blue-500 border-b-2 border-blue-500 pb-2">Login</button>
                    <button type="button" onclick="toggleAuth('register')" id="btnTabRegister" class="w-1/2 text-center text-slate-400 pb-2">Register</button>
                </div>

                <!-- Login Form -->
                <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-3">
                    <div>
                        <label class="text-[10px] text-slate-400">Email Address</label>
                        <input type="email" id="loginEmail" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Password</label>
                        <input type="password" id="loginPassword" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition">Login</button>
                </form>

                <!-- Register Form -->
                <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                    <div>
                        <label class="text-[10px] text-slate-400">Full Name</label>
                        <input type="text" id="regName" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Email Address</label>
                        <input type="email" id="regEmail" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Password</label>
                        <input type="password" id="regPassword" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none mt-1">
                    </div>
                    <button type="submit" id="regBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition">Create Account</button>
                </form>
            </div>
        </div>

        <!-- ================= 2. HOME / SHOP PAGE ================= -->
        <div id="page-home" class="hidden space-y-5">
            <div class="flex space-x-2 overflow-x-auto pb-1" id="categoryContainer"></div>
            <div class="space-y-3" id="productsContainer"></div>
        </div>

        <!-- ================= 3. DEPOSIT PAGE ================= -->
        <div id="page-deposit" class="hidden space-y-4">
            <div class="card-bg p-5 rounded-2xl space-y-4">
                <h2 class="font-bold text-sm text-center text-slate-200">Select Payment Method</h2>
                
                <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold">
                    <div onclick="selectPayment('bKash')" class="p-3 card-bg rounded-xl border border-slate-700 hover:border-pink-500 cursor-pointer flex flex-col items-center space-y-1">
                        <span class="text-pink-500 text-lg font-black">bKash</span>
                    </div>
                    <div onclick="selectPayment('Nagad')" class="p-3 card-bg rounded-xl border border-slate-700 hover:border-orange-500 cursor-pointer flex flex-col items-center space-y-1">
                        <span class="text-orange-500 text-lg font-black">Nagad</span>
                    </div>
                    <div onclick="selectPayment('Rocket')" class="p-3 card-bg rounded-xl border border-slate-700 hover:border-purple-500 cursor-pointer flex flex-col items-center space-y-1">
                        <span class="text-purple-500 text-lg font-black">Rocket</span>
                    </div>
                </div>

                <div id="paymentInstructions" class="hidden text-xs bg-[#0b132b] p-3 rounded-xl border border-slate-800 space-y-1"></div>

                <form onsubmit="handleDepositSubmit(event)" class="space-y-3">
                    <input type="number" id="depAmount" min="10" placeholder="Amount (৳)" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none">
                    <input type="text" id="depTrx" placeholder="TrxID (e.g. B8X9K2L0)" required class="w-full bg-[#0b132b] border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none uppercase font-mono">
                    <button type="submit" class="w-full bg-emerald-600 font-bold text-xs py-3 rounded-xl text-white">Submit Request</button>
                </form>
            </div>
        </div>

        <!-- ================= 4. HISTORY PAGE ================= -->
        <div id="page-history" class="hidden space-y-3">
            <h2 class="font-bold text-sm text-slate-200">Purchased Accounts</h2>
            <div id="historyContainer" class="space-y-2"></div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-[#0b132b] border-t border-slate-800 px-6 py-2 flex justify-between items-center text-xs text-slate-400 z-50">
        <button onclick="showTab('home')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </button>
        <button onclick="showTab('deposit')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span>Deposit</span>
        </button>
        <button onclick="showTab('history')" class="flex flex-col items-center space-y-1 hover:text-blue-400">
            <i class="fa-solid fa-rotate-left text-lg"></i>
            <span>History</span>
        </button>
        <button onclick="logout()" class="flex flex-col items-center space-y-1 hover:text-red-400">
            <i class="fa-solid fa-power-off text-lg"></i>
            <span>Logout</span>
        </button>
    </nav>

    <script>
        const config = { databaseURL: "https://mailmarket-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let currentUser = null;
        let selectedCat = "";
        let selectedMethod = "";

        // Safe Firebase Key Conversion
        function encodeEmail(email) {
            return email.toLowerCase().replace(/\./g, '_dot_');
        }

        // AUTHENTICATION LOGIC
        function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.innerText = "Creating Account...";
            btn.disabled = true;

            const name = document.getElementById('regName').value.trim();
            const rawEmail = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            const emailKey = encodeEmail(rawEmail);

            db.ref('users/' + emailKey).once('value')
                .then(snap => {
                    if(snap.exists()) {
                        alert('Email already registered! Please login.');
                    } else {
                        const userData = { name, email: rawEmail, pass, balance: 0, orders: [] };
                        db.ref('users/' + emailKey).set(userData)
                            .then(() => {
                                alert('Account Created Successfully! Please Login.');
                                toggleAuth('login');
                            });
                    }
                })
                .catch(err => alert("Database Error: " + err.message))
                .finally(() => {
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                });
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Logging in...";
            btn.disabled = true;

            const rawEmail = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const emailKey = encodeEmail(rawEmail);

            db.ref('users/' + emailKey).once('value')
                .then(snap => {
                    const u = snap.val();
                    if(u && u.pass === pass) {
                        currentUser = u;
                        localStorage.setItem('mm_user_key', emailKey);
                        loginSuccess();
                    } else {
                        alert('Invalid Email or Password!');
                    }
                })
                .catch(err => alert("Database Error: " + err.message))
                .finally(() => {
                    btn.innerText = "Login";
                    btn.disabled = false;
                });
        }

        function loginSuccess() {
            document.getElementById('page-auth').classList.add('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('mainHeader').classList.add('flex');
            document.getElementById('bottomNav').classList.remove('hidden');
            document.getElementById('bottomNav').classList.add('flex');

            const emailKey = encodeEmail(currentUser.email);
            db.ref('users/' + emailKey).on('value', snap => {
                currentUser = snap.val() || currentUser;
                document.getElementById('userBalance').innerText = (currentUser.balance || 0).toFixed(2);
                document.getElementById('userName').innerText = currentUser.name;
                renderHistory();
            });

            loadStoreData();
            showTab('home');
        }

        function logout() {
            localStorage.removeItem('mm_user_key');
            location.reload();
        }

        // STORE LOGIC
        function loadStoreData() {
            db.ref('categories').on('value', snap => {
                const cats = snap.val() || {};
                const list = Object.values(cats);
                const container = document.getElementById('categoryContainer');
                if(!selectedCat && list.length > 0) selectedCat = list[0].name;

                container.innerHTML = list.map(c => `
                    <button onclick="selectCat('${c.name}')" 
                        class="px-5 py-2 rounded-full font-bold text-xs border border-slate-700 transition ${selectedCat === c.name ? 'bg-blue-600 text-white' : 'bg-[#1c2541] text-slate-300'}">
                        ${c.name}
                    </button>
                `).join('');
            });

            db.ref('products').on('value', snap => {
                const prods = snap.val() || {};
                const list = Object.entries(prods);
                const filtered = list.filter(([k, p]) => p.category === selectedCat);
                const container = document.getElementById('productsContainer');

                if(filtered.length === 0) {
                    container.innerHTML = `<div class="card-bg p-4 rounded-xl text-center text-xs text-slate-400">No products available.</div>`;
                    return;
                }

                container.innerHTML = filtered.map(([key, p]) => {
                    const stock = p.stock || [];
                    return `
                        <div class="card-bg p-4 rounded-2xl space-y-3">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-sm text-slate-100">${p.title}</h3>
                                    <span class="text-[10px] text-blue-400 font-semibold">${p.subCategory || ''}</span>
                                </div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${stock.length > 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                                    ${stock.length > 0 ? 'IN STOCK' : 'OUT OF STOCK'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400">${p.desc || ''}</p>
                            <div class="text-blue-400 font-black text-base">৳ ${parseFloat(p.price).toFixed(2)}</div>
                            <div class="text-xs text-slate-400 flex items-center space-x-1">
                                <i class="fa-solid fa-box text-slate-500"></i>
                                <span>Available: <strong class="text-slate-200">${stock.length}</strong></span>
                            </div>
                            <button onclick="buyNow('${key}')" ${stock.length <= 0 ? 'disabled' : ''} 
                                class="w-full py-2.5 rounded-xl font-bold text-xs transition ${stock.length > 0 ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}">
                                ${stock.length > 0 ? 'Buy Now' : 'Out of Stock'}
                            </button>
                        </div>
                    `;
                }).join('');
            });
        }

        function selectCat(c) { selectedCat = c; loadStoreData(); }

        function buyNow(key) {
            db.ref('products/' + key).once('value', snap => {
                const p = snap.val();
                if(!p || !p.stock || p.stock.length === 0) return alert('Out of stock!');
                if(currentUser.balance < p.price) return alert('Insufficient Balance! Please Deposit.');

                const acc = p.stock.shift();
                const newBal = currentUser.balance - p.price;
                const orders = currentUser.orders || [];
                orders.push({ title: p.title, acc: acc, date: new Date().toLocaleDateString() });

                const emailKey = encodeEmail(currentUser.email);
                db.ref('products/' + key + '/stock').set(p.stock);
                db.ref('users/' + emailKey).update({ balance: newBal, orders: orders });
                alert('Purchased Successfully!');
            });
        }

        // DEPOSIT
        function selectPayment(method) {
            selectedMethod = method;
            db.ref('methods/' + method).once('value', snap => {
                const info = snap.val() || { num: '01700000000', note: 'Send Money' };
                const ins = document.getElementById('paymentInstructions');
                ins.classList.remove('hidden');
                ins.innerHTML = `<p class="font-bold text-amber-400">${method} Number: <span class="text-white font-mono">${info.num}</span></p><p class="text-slate-400">${info.note}</p>`;
            });
        }

        function handleDepositSubmit(e) {
            e.preventDefault();
            if(!selectedMethod) return alert('Please select a payment method!');
            const amt = parseFloat(document.getElementById('depAmount').value);
            const trx = document.getElementById('depTrx').value.trim();

            db.ref('deposits').push({
                userKey: encodeEmail(currentUser.email),
                email: currentUser.email,
                name: currentUser.name,
                method: selectedMethod,
                amount: amt,
                trx: trx,
                status: 'Pending'
            });

            alert('Deposit Request Sent! Admin will review it.');
            document.getElementById('depAmount').value = '';
            document.getElementById('depTrx').value = '';
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const orders = currentUser.orders || [];
            if(orders.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400">No purchases yet.</p>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="card-bg p-3 rounded-xl text-xs space-y-1">
                    <div class="flex justify-between font-bold text-blue-400">
                        <span>${o.title}</span>
                        <span class="text-slate-500 text-[10px]">${o.date}</span>
                    </div>
                    <div class="bg-[#0b132b] p-2 rounded border border-slate-800 font-mono text-emerald-400 break-all select-all">${o.acc}</div>
                </div>
            `).join('');
        }

        function showTab(t) {
            ['home', 'deposit', 'history'].forEach(p => document.getElementById(`page-${p}`).classList.add('hidden'));
            document.getElementById(`page-${t}`).classList.remove('hidden');
        }

        function toggleAuth(t) {
            if(t === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('formRegister').classList.add('hidden');
                document.getElementById('btnTabLogin').className = "w-1/2 text-center text-blue-500 border-b-2 border-blue-500 pb-2";
                document.getElementById('btnTabRegister').className = "w-1/2 text-center text-slate-400 pb-2";
            } else {
                document.getElementById('formLogin').classList.add('hidden');
                document.getElementById('formRegister').classList.remove('hidden');
                document.getElementById('btnTabRegister').className = "w-1/2 text-center text-blue-500 border-b-2 border-blue-500 pb-2";
                document.getElementById('btnTabLogin').className = "w-1/2 text-center text-slate-400 pb-2";
            }
        }

        // Auto Login Check
        window.onload = () => {
            const savedKey = localStorage.getItem('mm_user_key');
            if(savedKey) {
                db.ref('users/' + savedKey).once('value', snap => {
                    if(snap.exists()) {
                        currentUser = snap.val();
                        loginSuccess();
                    }
                });
            }
        };
    </script>
</body>
</html>
